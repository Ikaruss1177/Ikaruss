    <style>
        /* ==========================================
           CONFIGURACIÓN GENERAL
           ========================================== */
        :root {
            --cyan: var(--mr-accent, #00ffcc);
            --blue: var(--mr-border, #22262a);
            --dark: var(--mr-bg, #0b0c0d);
            --panel: rgba(var(--mr-surface-rgb, 20, 22, 25), 0.82);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: var(--mr-bg, #0b0c0d);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 4vh 2vw;
            background-color: var(--mr-bg, #0b0c0d);
            background-image: url('https://bitacoramegaroad.github.io/img/Galaxia.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: var(--mr-text, #e0e0e0);
            font-family: var(--mr-font-body, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif);
        }

        /* ==========================================
           CABECERA
           ========================================== */
        #header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 5vh 2vw;
            background: var(--panel);
            border-bottom: 2px solid var(--mr-border, #22262a);
            text-align: center;
        }

        #header img {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        #header .logo-link {
            display: inline-block;
            width: 100%;
            max-width: 650px;
        }

        #header h1 {
            margin: 20px 0 0;
            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: normal;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.35);
        }

        /* ==========================================
           MENÚ Y SELECTORES
           ========================================== */
        #menu {
            background: var(--panel);
        }

        #selector {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background: transparent;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
        }

        select {
            min-width: 180px;
            max-width: 100%;
            padding: 11px 12px;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 4px;
            cursor: none !important;
            color-scheme: dark;
        }

        select option {
            background: rgba(5, 9, 14, 0.88);
            color: var(--cyan);
        }

        /* ==========================================
           BOTONES GENERALES
           ========================================== */
        button {
            padding: 11px 20px;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            font-weight: normal;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 50px;
            cursor: pointer;
            text-shadow: none !important;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(var(--mr-accent-rgb, 0, 255, 204), 0.08);
            border-color: var(--mr-accent, #00ffcc);
            box-shadow: 0 0 12px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.25);
        }

           BOTÓN VOLVER A LA BITÁCORA
           ========================================== */
        #btnBitacora {
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-height: 55px;
            margin: 20px auto;
            padding: 10px 25px;

            background: linear-gradient(
                135deg,
                rgba(6, 11, 17, 0.4) 0%,
                rgba(17, 27, 39, 0.4) 100%
            );

            border: 1.5px solid #ffffff;
            border-radius: 50px;

            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            font-weight: normal;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-align: center;

            transition: all 0.3s ease;
        }

        #btnBitacora:hover {
            background: linear-gradient(
                135deg,
                rgba(9, 19, 30, 0.75) 0%,
                rgba(23, 40, 58, 0.75) 100%
            );

            border-color: var(--mr-accent, #00ffcc);
            box-shadow: 0 0 15px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.4);
        }

        /* ==========================================
           ÁREA DEL EMULADOR
           ========================================== */
        #emulador {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100px;
            margin-top: 20px;
            padding: 12px;
            overflow: auto;
            background: transparent !important;
            color: var(--mr-text-soft, #b9c3cd) !important;
        }

        #emulador .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: min(675px, 75vh);
            min-height: 360px;
            margin: 0 auto;
        }

        #emulador #game {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 360px;
        }

        /* El emulador ocupa el contenedor disponible */
        #emulador #game canvas,
        #emulador #game iframe {
            max-width: 100%;
        }

        /* ==========================================
           BOTÓN VOLVER AL MENÚ DE JUEGOS
           ========================================== */
        #btnVolver {
            display: none;
            margin: 20px auto;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 50px;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
        }

           MENSAJES DE CARGA Y DESCARGA
           ========================================== */
        #progreso,
        #detalle,
        #status,
        #loading,
        #progress,
        #mensaje {
            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
        }

        #barra {
            background: var(--cyan) !important;
        }

           ADAPTACIÓN PARA MÓVILES
           ========================================== */

</head>

    <script>
        const customCursor = document.querySelector('.custom-cursor');
        const finePointer = window.matchMedia('(pointer: fine)');

        function syncCustomCursor() {
            if (customCursor) {
                customCursor.style.display = 'none';
            }
        }

        syncCustomCursor();
        finePointer.addEventListener?.('change', syncCustomCursor);

        if (customCursor && finePointer.matches) {
            document.addEventListener('mousemove', (event) => {
                customCursor.style.left = `${event.clientX}px`;
                customCursor.style.top = `${event.clientY}px`;
                customCursor.style.display = 'block';
            });

            document.querySelectorAll('a, button, select').forEach((element) => {
                element.addEventListener('mouseenter', () => customCursor.classList.add('hover'));
                element.addEventListener('mouseleave', () => customCursor.classList.remove('hover'));
            });
        }
    </script>

        /* ==========================================
           CONTENEDOR RESPONSIVO DEL JUEGO
           ========================================== */
        function crearContenedorJuego() {
            document.getElementById('emulador').innerHTML = `
                <div class="game-container">
                    <div id="game"></div>
                </div>
            `;
        }

        /* ==========================================
           CARGA DIRECTA MEDIANTE PARÁMETROS URL
           ========================================== */
        if (params.get('core') && params.get('rom')) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            crearContenedorJuego();

            document.getElementById('btnVolver').style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = params.get('core');

            const romParam = params.get('rom');

            try {
                const parsed = JSON.parse(romParam);

                window.EJS_gameUrl = Array.isArray(parsed)
                    ? parsed[0]
                    : parsed;

                if (Array.isArray(parsed) && parsed.length > 1) {
                    window.EJS_multidisk = parsed;
                }
            } catch (e) {
                window.EJS_gameUrl = romParam;
            }

            window.EJS_pathtodata = 'data/';

            if (params.get('bios')) {
                window.EJS_biosUrl = params.get('bios');
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

                '<option value="">Selecciona juego</option>';

            if (consola && juegos[consola]) {
                juegos[consola].forEach((juego, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = juego.nombre;
                    selectJuego.appendChild(option);
                });
            }
        }

        /* ==========================================
           ENSAMBLAR JUEGOS DE PLAYSTATION
           ========================================== */
        async function ensamblarDiscos(juego) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            document.getElementById('emulador').innerHTML = `
                <div style="
                    width:100%;
                    max-width:700px;
                    margin:0 auto;
                    padding:40px 15px;
                    text-align:center;
                ">
                    <div id="progreso" style="
                        color:#00ffcc;
                        font-size:14px;
                        overflow-wrap:anywhere;
                    ">
                        Preparando descarga...
                    </div>

                    <div style="
                        width:100%;
                        max-width:400px;
                        margin:20px auto;
                        background:#111;
                        border:1px solid #0077b6;
                    ">
                        <div id="barra" style="
                            width:0%;
                            height:20px;
                            background:#00ffcc;
                            transition:width 0.3s;
                        "></div>
                    </div>

                    <div id="detalle" style="
                        color:#00ffcc;
                        font-size:12px;
                    "></div>
                </div>
            `;

            document.getElementById('btnVolver').style.display = 'block';

            const totalPartes = juego.partes.reduce(
                (total, disco) => total + disco.archivos.length,
                0
            );

            let descargadas = 0;
            const urls = [];

            for (let d = 0; d < juego.partes.length; d++) {
                const disco = juego.partes[d];
                const partes = [];

                for (let i = 0; i < disco.archivos.length; i++) {
                    const progreso = document.getElementById('progreso');
                    const barra = document.getElementById('barra');
                    const detalle = document.getElementById('detalle');

                    progreso.textContent =
                        `Descargando Disco ${disco.disco} - parte ${i + 1} de ${disco.archivos.length}...`;

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;

                    try {
                        const resp = await fetch(disco.archivos[i]);

                        if (!resp.ok) {
                            throw new Error(
                                `Error HTTP ${resp.status} al descargar ${disco.archivos[i]}`
                            );
                        }

                        partes.push(await resp.arrayBuffer());
                    } catch (error) {
                        progreso.textContent = 'Error durante la descarga.';
                        detalle.textContent =
                            'No se pudo descargar una parte del juego. Revisá la conexión e intentá nuevamente.';

                        console.error(error);
                        return;
                    }

                    descargadas++;

                    barra.style.width =
                        (descargadas / totalPartes * 100) + '%';

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;
                }

                const blob = new Blob(partes, {
                    type: 'application/octet-stream'
                });

                urls.push(URL.createObjectURL(blob));
            }

            document.getElementById('progreso').textContent =
                'Iniciando emulador...';

            document.getElementById('detalle').textContent = '';

            /*
             * Conservamos la lógica original de carga:
             * el primer disco se entrega al emulador.
             */
            crearContenedorJuego();

            window.EJS_player = '#game';
            window.EJS_core = juego.core;
            window.EJS_gameUrl = urls[0];
            window.EJS_pathtodata = 'data/';

            if (juego.bios) {
                window.EJS_biosUrl = juego.bios;
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

        /* ==========================================
           CARGAR JUEGO SELECCIONADO
           ========================================== */
        function cargarJuego() {
            const consola = document.getElementById('consola').value;
            const idx = document.getElementById('juego').value;

            if (!consola || idx === '') {
                return;
            }

            const juego = juegos[consola][idx];

            if (juego.partes) {
                ensamblarDiscos(juego);

            } else if (Array.isArray(juego.archivo)) {
                document.getElementById('header').style.display = 'none';
                document.getElementById('menu').style.display = 'none';

                crearContenedorJuego();

                document.getElementById('btnVolver').style.display = 'block';

                window.EJS_player = '#game';
                window.EJS_core = juego.core;
                window.EJS_gameUrl = juego.archivo;
                window.EJS_pathtodata = 'data/';

                if (juego.bios) {
                    window.EJS_biosUrl = juego.bios;
                }

                const script = document.createElement('script');
                script.src = 'data/loader.js';
                document.body.appendChild(script);

            } else {
                let url =
                    '?core=' + encodeURIComponent(juego.core) +
                    '&rom=' + encodeURIComponent(juego.archivo);

                if (juego.bios) {
                    url += '&bios=' + encodeURIComponent(juego.bios);
                }

                window.location.href = url;
            }
        }

        /* ==========================================
           EVENTOS DE LOS CONTROLES
           ========================================== */
        document.getElementById('consola').addEventListener(
            'change',
            actualizarJuegos
        );

        document.getElementById('btnJugar').addEventListener(
            'click',
            cargarJuego
        );

        document.getElementById('btnVolver').addEventListener(
            'click',
            () => {
                window.location.href = window.location.pathname;
            }
        );
    </script>
</body>
</html>
