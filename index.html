
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikaruss Retrogaming Zone</title>
    <link rel="stylesheet" href="https://bitacoramegaroad.github.io/css/indexstyle.css">

    <style>
        /* ==========================================
           CONFIGURACIÓN GENERAL
           ========================================== */
        :root {
            --cyan: var(--mr-accent, #00ffcc);
            --blue: var(--mr-border, #22262a);
            --dark: var(--mr-bg, #0b0c0d);
            --panel: rgba(var(--mr-surface-rgb, 20, 22, 25), 0.82);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: var(--mr-bg, #0b0c0d);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 4vh 2vw;
            background-color: var(--mr-bg, #0b0c0d);
            background-image: url('https://bitacoramegaroad.github.io/img/Galaxia.webp');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: var(--mr-text, #e0e0e0);
            font-family: var(--mr-font-body, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif);
        }

        /* ==========================================
           CABECERA
           ========================================== */
        #header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 5vh 2vw;
            background: var(--panel);
            border-bottom: 2px solid var(--mr-border, #22262a);
            text-align: center;
        }

        #header img {
            display: block;
            width: 100%;
            max-width: 430px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        #header .logo-link {
            display: inline-block;
            width: 100%;
            max-width: 430px;
        }

        #header h1 {
            margin: 20px 0 0;
            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: normal;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.35);
        }

        /* ==========================================
           MENÚ Y SELECTORES
           ========================================== */
        #menu {
            background: var(--panel);
        }

        #selector {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background: transparent;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
        }

        select {
            min-width: 180px;
            max-width: 100%;
            padding: 11px 12px;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 4px;
            cursor: none !important;
            color-scheme: dark;
        }

        select option {
            background: rgba(5, 9, 14, 0.88);
            color: var(--cyan);
        }

        /* ==========================================
           BOTONES GENERALES
           ========================================== */
        button {
            padding: 11px 20px;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            font-weight: normal;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 50px;
            cursor: pointer;
            text-shadow: none !important;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(var(--mr-accent-rgb, 0, 255, 204), 0.08);
            border-color: var(--mr-accent, #00ffcc);
            box-shadow: 0 0 12px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.25);
        }

        /* ==========================================
           BOTÓN VOLVER A LA BITÁCORA
           ========================================== */
        #btnBitacora {
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-height: 50px;
            margin: 20px auto;
            padding: 10px 25px;

            background: linear-gradient(
                135deg,
                rgba(6, 11, 17, 0.4) 0%,
                rgba(17, 27, 39, 0.4) 100%
            );

            border: 1.5px solid #ffffff;
            border-radius: 50px;

            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
            font-size: 12px;
            font-weight: normal;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-align: center;

            transition: all 0.3s ease;
        }

        #btnBitacora:hover {
            background: linear-gradient(
                135deg,
                rgba(9, 19, 30, 0.75) 0%,
                rgba(23, 40, 58, 0.75) 100%
            );

            border-color: var(--mr-accent, #00ffcc);
            box-shadow: 0 0 15px rgba(var(--mr-accent-rgb, 0, 255, 204), 0.4);
        }

        /* ==========================================
           ÁREA DEL EMULADOR
           ========================================== */
        #emulador {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100px;
            margin-top: 20px;
            padding: 12px;
            overflow: auto;
            background: transparent !important;
            color: var(--mr-text-soft, #b9c3cd) !important;
        }

        /* Contenedor del juego: hasta 1200 px */
        #emulador .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: min(675px, 75vh);
            min-height: 360px;
            margin: 0 auto;
        }

        #emulador #game {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 360px;
        }

        /* El emulador ocupa el contenedor disponible */
        #emulador #game canvas,
        #emulador #game iframe {
            max-width: 100%;
        }

        /* ==========================================
           BOTÓN VOLVER AL MENÚ DE JUEGOS
           ========================================== */
        #btnVolver {
            display: none;
            margin: 20px auto;
            background: rgba(5, 9, 14, 0.88);
            color: var(--mr-accent, #00ffcc) !important;
            border: 1px solid var(--mr-border, #22262a);
            border-radius: 50px;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
        }

        /* ==========================================
           MENSAJES DE CARGA Y DESCARGA
           ========================================== */
        #progreso,
        #detalle,
        #status,
        #loading,
        #progress,
        #mensaje {
            color: var(--cyan) !important;
            font-family: var(--mr-font-display, 'Conthrax', monospace, sans-serif);
        }

        #barra {
            background: var(--cyan) !important;
        }

        /* ==========================================
           ADAPTACIÓN PARA MÓVILES
           ========================================== */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            #header {
                padding: 4vh 4vw;
            }

            #header h1 {
                margin-top: 16px;
                font-size: clamp(1.1rem, 5vw, 1.5rem);
                letter-spacing: 1px;
            }

            #selector {
                flex-direction: column;
                padding: 16px 12px;
            }

            select,
            #selector button {
                width: 100%;
                max-width: 400px;
            }

            #btnBitacora {
                width: 90%;
                max-width: 400px;
                min-height: 50px;
                font-size: 11px;
            }

            #emulador {
                margin-top: 12px;
                padding: 5px;
            }

            #emulador .game-container {
                width: 100%;
                height: min(70vh, 540px);
                min-height: 300px;
            }

            #emulador #game {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
    <header id="header" class="macross-header">
        <a class="logo-link" href="https://bitacoramegaroad.github.io/" aria-label="Ir a La Bitácora del Megaroad">
            <img class="logo" src="LaBitacoraDelMegaroad.png" alt="La Bitácora del Megaroad">
        </a>
        <h1>Ikaruss Retrogaming Zone</h1>
    </header>

    <div id="menu">
        <div id="selector">
            <select id="consola">
                <option value="">Selecciona consola</option>
                <option value="nes">NES</option>
                <option value="snes">Super NES</option>
                <option value="gbc">Game Boy Color</option>
                <option value="wonderswan">Bandai WonderSwan</option>
                <option value="genesis">Sega Genesis</option>
                <option value="mame">MAME Arcade</option>
                <option value="psx">PlayStation</option>
            </select>

            <select id="juego">
                <option value="">Selecciona juego</option>
            </select>

            <button id="btnJugar">Jugar</button>
        </div>
    </div>
<div id="emulador"></div>

    <button id="btnVolver">Volver al menú</button>

    <a
        href="https://bitacoramegaroad.github.io/"
        id="btnBitacora"
        class="site-button"
    >Volver a la Bitácora del Megaroad</a>
    </div>

    <div class="custom-cursor" aria-hidden="true">
        <svg class="reticle-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 6 L2 18 L2 62 L28 74" fill="none" stroke="#00ffcc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" />
            <path d="M72 6 L98 18 L98 62 L72 74" fill="none" stroke="#00ffcc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" />
            <rect class="corner-square" x="79" y="75.5" width="13" height="20" fill="#00ffcc" transform="rotate(63 85 70)" />
        </svg>
        <div class="lock-text">LOCK ON</div>
    </div>

    <script>
        const customCursor = document.querySelector('.custom-cursor');
        const finePointer = window.matchMedia('(pointer: fine)');

        function syncCustomCursor() {
            if (customCursor) {
                customCursor.style.display = 'none';
            }
        }

        syncCustomCursor();
        finePointer.addEventListener?.('change', syncCustomCursor);

        if (customCursor && finePointer.matches) {
            document.addEventListener('mousemove', (event) => {
                customCursor.style.left = `${event.clientX}px`;
                customCursor.style.top = `${event.clientY}px`;
                customCursor.style.display = 'block';
            });

            document.querySelectorAll('a, button, select').forEach((element) => {
                element.addEventListener('mouseenter', () => customCursor.classList.add('hover'));
                element.addEventListener('mouseleave', () => customCursor.classList.remove('hover'));
            });
        }
    </script>

    <script>
        const isDiscordActivity = window.location.href.includes('discordsays.com');
        const base = isDiscordActivity
            ? '/roms/'
            : 'https://ikaruss1177.github.io/Ikaruss/';

        const romBases = {
            nes: isDiscordActivity ? base : base + 'roms%20nes/',
            snes: isDiscordActivity ? base : base + 'roms%20snes/',
            gbc: isDiscordActivity ? base : base + 'roms%20gameboy/',
            wonderswan: isDiscordActivity ? base : base + 'roms%20bandai/',
            genesis: isDiscordActivity ? base : base + 'roms%20sega/',
            mame: isDiscordActivity ? base : base + 'roms%20mame/'
        };

        const basePSX = window.location.href.includes('discordsays.com')
            ? '/psx/'
            : 'https://ikaruss1177.github.io/Playrom/';

        const sistemas = {
            nes: { catalogo: 'nes.json', base: romBases.nes, core: 'nes' },
            snes: { catalogo: 'snes.json', base: romBases.snes, core: 'snes' },
            gbc: { catalogo: 'gbc.json', base: romBases.gbc, core: 'gambatte' },
            wonderswan: { catalogo: 'wonderswan.json', base: romBases.wonderswan, core: 'ws' },
            genesis: { catalogo: 'genesis.json', base: romBases.genesis, core: 'segaMD' },
            mame: { catalogo: 'mame.json', base: romBases.mame, core: 'arcade' },
            psx: {
                catalogo: 'psx.json',
                base: basePSX,
                partesPath: 'psx/',
                core: 'psx'
            }
        };

        const juegos = {};

        function codificarRuta(ruta) {
            return ruta.split('/').map(encodeURIComponent).join('/');
        }

        async function cargarCatalogo(consola) {
            if (juegos[consola]) {
                return juegos[consola];
            }

            const sistema = sistemas[consola];
            if (!sistema) {
                throw new Error(`No hay configuración para la consola ${consola}.`);
            }

            const respuesta = await fetch(`data/catalogos/${sistema.catalogo}`);
            if (!respuesta.ok) {
                throw new Error(`No se pudo cargar data/catalogos/${sistema.catalogo} (HTTP ${respuesta.status}).`);
            }

            const catalogo = await respuesta.json();
            if (!Array.isArray(catalogo.juegos)) {
                throw new Error(`El archivo ${sistema.catalogo} no contiene una lista "juegos" válida.`);
            }

            juegos[consola] = catalogo.juegos.map(definicion => {
                const juego = {
                    nombre: definicion.titulo,
                    core: definicion.core || sistema.core
                };

                if (definicion.archivo) {
                    juego.archivo = sistema.base + encodeURIComponent(definicion.archivo);
                }

                if (definicion.bios) {
                    juego.bios = sistema.base + codificarRuta(definicion.bios);
                }

                if (Array.isArray(definicion.partes)) {
                    juego.partes = definicion.partes.map(disco => ({
                        disco: disco.disco,
                        archivos: disco.archivos.map(archivo =>
                            sistema.base + codificarRuta(`${sistema.partesPath || ''}${archivo}`)
                        )
                    }));
                }

                return juego;
            });

            return juegos[consola];
        }
        const params = new URLSearchParams(window.location.search);

        /* ==========================================
           CONTENEDOR RESPONSIVO DEL JUEGO
           ========================================== */
        function crearContenedorJuego() {
            document.getElementById('emulador').innerHTML = `
                <div class="game-container">
                    <div id="game"></div>
                </div>
            `;
        }

        /* ==========================================
           CARGA DIRECTA MEDIANTE PARÁMETROS URL
           ========================================== */
        if (params.get('core') && params.get('rom')) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            crearContenedorJuego();

            document.getElementById('btnVolver').style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = params.get('core');

            const romParam = params.get('rom');

            try {
                const parsed = JSON.parse(romParam);

                window.EJS_gameUrl = Array.isArray(parsed)
                    ? parsed[0]
                    : parsed;

                if (Array.isArray(parsed) && parsed.length > 1) {
                    window.EJS_multidisk = parsed;
                }
            } catch (e) {
                window.EJS_gameUrl = romParam;
            }

            window.EJS_pathtodata = 'data/';

            if (params.get('bios')) {
                window.EJS_biosUrl = params.get('bios');
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

        /* ==========================================
           ACTUALIZAR LISTA DE JUEGOS
           ========================================== */
        async function actualizarJuegos() {
            const consola = document.getElementById('consola').value;
            const selectJuego = document.getElementById('juego');

            selectJuego.innerHTML = '<option value="">Cargando juegos...</option>';
            selectJuego.disabled = true;

            if (!consola) {
                selectJuego.innerHTML = '<option value="">Selecciona juego</option>';
                selectJuego.disabled = false;
                return;
            }

            try {
                const lista = await cargarCatalogo(consola);
                if (document.getElementById('consola').value !== consola) {
                    return;
                }

                selectJuego.innerHTML = '<option value="">Selecciona juego</option>';
                lista.forEach((juego, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = juego.nombre;
                    selectJuego.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                selectJuego.innerHTML = '<option value="">No se pudo cargar la lista</option>';
            } finally {
                selectJuego.disabled = false;
            }
        }
        /* ==========================================
           ENSAMBLAR JUEGOS DE PLAYSTATION
           ========================================== */
        async function ensamblarDiscos(juego) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            document.getElementById('emulador').innerHTML = `
                <div style="
                    width:100%;
                    max-width:700px;
                    margin:0 auto;
                    padding:40px 15px;
                    text-align:center;
                ">
                    <div id="progreso" style="
                        color:#00ffcc;
                        font-size:14px;
                        overflow-wrap:anywhere;
                    ">
                        Preparando descarga...
                    </div>

                    <div style="
                        width:100%;
                        max-width:400px;
                        margin:20px auto;
                        background:#111;
                        border:1px solid #0077b6;
                    ">
                        <div id="barra" style="
                            width:0%;
                            height:20px;
                            background:#00ffcc;
                            transition:width 0.3s;
                        "></div>
                    </div>

                    <div id="detalle" style="
                        color:#00ffcc;
                        font-size:12px;
                    "></div>
                </div>
            `;

            document.getElementById('btnVolver').style.display = 'block';

            const totalPartes = juego.partes.reduce(
                (total, disco) => total + disco.archivos.length,
                0
            );

            let descargadas = 0;
            const urls = [];

            for (let d = 0; d < juego.partes.length; d++) {
                const disco = juego.partes[d];
                const partes = [];

                for (let i = 0; i < disco.archivos.length; i++) {
                    const progreso = document.getElementById('progreso');
                    const barra = document.getElementById('barra');
                    const detalle = document.getElementById('detalle');

                    progreso.textContent =
                        `Descargando Disco ${disco.disco} - parte ${i + 1} de ${disco.archivos.length}...`;

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;

                    try {
                        const resp = await fetch(disco.archivos[i]);

                        if (!resp.ok) {
                            throw new Error(
                                `Error HTTP ${resp.status} al descargar ${disco.archivos[i]}`
                            );
                        }

                        partes.push(await resp.arrayBuffer());
                    } catch (error) {
                        progreso.textContent = 'Error durante la descarga.';
                        detalle.textContent =
                            'No se pudo descargar una parte del juego. Revisá la conexión e intentá nuevamente.';

                        console.error(error);
                        return;
                    }

                    descargadas++;

                    barra.style.width =
                        (descargadas / totalPartes * 100) + '%';

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;
                }

                const blob = new Blob(partes, {
                    type: 'application/octet-stream'
                });

                urls.push(URL.createObjectURL(blob));
            }

            document.getElementById('progreso').textContent =
                'Iniciando emulador...';

            document.getElementById('detalle').textContent = '';

            /*
             * Conservamos la lógica original de carga:
             * el primer disco se entrega al emulador.
             */
            crearContenedorJuego();

            window.EJS_player = '#game';
            window.EJS_core = juego.core;
            window.EJS_gameUrl = urls[0];
            window.EJS_pathtodata = 'data/';

            if (juego.bios) {
                window.EJS_biosUrl = juego.bios;
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

        /* ==========================================
           CARGAR JUEGO SELECCIONADO
           ========================================== */
        function cargarJuego() {
            const consola = document.getElementById('consola').value;
            const idx = document.getElementById('juego').value;

            if (!consola || idx === '' || !juegos[consola]) {
                return;
            }

            const juego = juegos[consola][idx];
            if (!juego) {
                return;
            }

            if (juego.partes) {
                ensamblarDiscos(juego);

            } else if (Array.isArray(juego.archivo)) {
                document.getElementById('header').style.display = 'none';
                document.getElementById('menu').style.display = 'none';

                crearContenedorJuego();
                document.getElementById('btnVolver').style.display = 'block';

                window.EJS_player = '#game';
                window.EJS_core = juego.core;
                window.EJS_gameUrl = juego.archivo;
                window.EJS_pathtodata = 'data/';

                if (juego.bios) {
                    window.EJS_biosUrl = juego.bios;
                }

                const script = document.createElement('script');
                script.src = 'data/loader.js';
                document.body.appendChild(script);

            } else {
                let url =
                    '?core=' + encodeURIComponent(juego.core) +
                    '&rom=' + encodeURIComponent(juego.archivo);

                if (juego.bios) {
                    url += '&bios=' + encodeURIComponent(juego.bios);
                }

                window.location.href = url;
            }
        }
        /* ==========================================
           EVENTOS DE LOS CONTROLES
           ========================================== */
        document.getElementById('consola').addEventListener(
            'change',
            actualizarJuegos
        );

        document.getElementById('btnJugar').addEventListener(
            'click',
            cargarJuego
        );

        document.getElementById('btnVolver').addEventListener(
            'click',
            () => {
                window.location.href = window.location.pathname;
            }
        );
    </script>
</body>
</html>
