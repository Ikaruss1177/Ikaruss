
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikaruss Retrogaming Zone</title>

    <style>
        /* ==========================================
           FUENTE CONTHRAX
           ========================================== */
        @font-face {
            font-family: 'Conthrax';
            src: url('https://ikaruss1177.github.io/Ikaruss/conthrax-sb.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================
           CONFIGURACIÓN GENERAL
           ========================================== */
        :root {
            --cyan: #00ffcc;
            --blue: #0077b6;
            --dark: #081219;
            --panel: rgba(5, 9, 14, 0.88);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: #05090e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05090e;
            background-image: url('https://ikaruss1177.github.io/Ikaruss/Galaxia.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: var(--cyan);
            font-family: 'Conthrax', monospace, sans-serif;
        }

        /* Texto cian en la interfaz */
        body,
        body * {
            color: var(--cyan);
        }

        /* ==========================================
           CABECERA
           ========================================== */
        #header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--blue);
        }

        #header img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        #header h1 {
            margin: 0 15px;
            color: var(--cyan) !important;
            font-family: 'Conthrax', monospace, sans-serif;
            font-size: clamp(16px, 2.5vw, 25px);
            font-weight: normal;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: none !important;
        }

        /* ==========================================
           MENÚ Y SELECTORES
           ========================================== */
        #menu {
            background: var(--panel);
        }

        #selector {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background: transparent;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
        }

        select {
            min-width: 180px;
            max-width: 100%;
            padding: 11px 12px;
            background: #081219;
            color: var(--cyan) !important;
            font-family: 'Conthrax', monospace, sans-serif;
            font-size: 12px;
            border: 1px solid var(--blue);
            border-radius: 3px;
            cursor: pointer;
            color-scheme: dark;
        }

        select option {
            background: #081219;
            color: var(--cyan);
        }

        /* ==========================================
           BOTONES GENERALES
           ========================================== */
        button {
            padding: 11px 20px;
            background: #081219;
            color: var(--cyan) !important;
            font-family: 'Conthrax', monospace, sans-serif;
            font-size: 12px;
            font-weight: normal;
            border: 1px solid var(--blue);
            border-radius: 3px;
            cursor: pointer;
            text-shadow: none !important;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #12313d;
            border-color: var(--cyan);
        }

        /* ==========================================
           BOTÓN VOLVER A LA BITÁCORA
           ========================================== */
        #btnBitacora {
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-height: 55px;
            margin: 20px auto;
            padding: 10px 25px;

            background: linear-gradient(
                135deg,
                rgba(6, 11, 17, 0.4) 0%,
                rgba(17, 27, 39, 0.4) 100%
            );

            border: 1.5px solid #ffffff;
            border-radius: 50px;

            color: var(--cyan) !important;
            font-family: 'Conthrax', monospace, sans-serif;
            font-size: 12px;
            font-weight: normal;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-align: center;

            transition: all 0.3s ease;
        }

        #btnBitacora:hover {
            background: linear-gradient(
                135deg,
                rgba(9, 19, 30, 0.75) 0%,
                rgba(23, 40, 58, 0.75) 100%
            );

            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* ==========================================
           ÁREA DEL EMULADOR
           ========================================== */
        #emulador {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100px;
            margin-top: 20px;
            padding: 12px;
            overflow: auto;
            background: transparent !important;
            color: var(--cyan) !important;
        }

        /* Contenedor del juego: hasta 1200 px */
        #emulador .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: min(675px, 75vh);
            min-height: 360px;
            margin: 0 auto;
        }

        #emulador #game {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 360px;
        }

        /* El emulador ocupa el contenedor disponible */
        #emulador #game canvas,
        #emulador #game iframe {
            max-width: 100%;
        }

        /* ==========================================
           BOTÓN VOLVER AL MENÚ DE JUEGOS
           ========================================== */
        #btnVolver {
            display: none;
            margin: 20px auto;
            background: #081219;
            color: var(--cyan) !important;
            border: 1px solid var(--blue);
            border-radius: 50px;
            font-family: 'Conthrax', monospace, sans-serif;
        }

        /* ==========================================
           MENSAJES DE CARGA Y DESCARGA
           ========================================== */
        #progreso,
        #detalle,
        #status,
        #loading,
        #progress,
        #mensaje {
            color: var(--cyan) !important;
            font-family: 'Conthrax', monospace, sans-serif;
        }

        #barra {
            background: var(--cyan) !important;
        }

        /* ==========================================
           ADAPTACIÓN PARA MÓVILES
           ========================================== */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            #header {
                gap: 8px;
                padding: 14px 8px;
            }

            #header img {
                height: 32px;
            }

            #header h1 {
                margin: 0 4px;
                font-size: 14px;
                letter-spacing: 1px;
            }

            #selector {
                flex-direction: column;
                padding: 16px 12px;
            }

            select,
            #selector button {
                width: 100%;
                max-width: 400px;
            }

            #btnBitacora {
                width: 90%;
                max-width: 400px;
                min-height: 50px;
                font-size: 11px;
            }

            #emulador {
                margin-top: 12px;
                padding: 5px;
            }

            #emulador .game-container {
                width: 100%;
                height: min(70vh, 540px);
                min-height: 300px;
            }

            #emulador #game {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div id="header">
        <img src="Megaroad%20logo.png" alt="Megaroad">
        <h1>Ikaruss Retrogaming Zone</h1>
        <img src="Megaroad%20logo.png" alt="Megaroad">
    </div>

    <div id="menu">
        <div id="selector">
            <select id="consola">
                <option value="">Selecciona consola</option>
                <option value="nes">NES</option>
                <option value="snes">Super NES</option>
                <option value="gbc">Game Boy Color</option>
                <option value="wonderswan">Bandai WonderSwan</option>
                <option value="genesis">Sega Genesis</option>
                <option value="mame">MAME Arcade</option>
                <option value="psx">PlayStation</option>
            </select>

            <select id="juego">
                <option value="">Selecciona juego</option>
            </select>

            <button id="btnJugar">Jugar</button>
        </div>
    </div>

    <a
        href="https://bitacoramegaroad.github.io/"
        id="btnBitacora"
    >Volver a La Bitácora</a>

    <div id="emulador"></div>

    <button id="btnVolver">Volver al menú</button>

    <script>

                    core: 'ws'
                },
                {
                    nombre: 'Sakura Card Captor - Las Cartas Clow',
                    archivo: base + 'Cardcaptor%20Sakura%20-%20Sakura%20to%20Fushigi%20na%20Clow%20Card%20(Japan).ws',
                    core: 'ws'

                },

                    archivo: base + 'JURASSIC.SMD',

                }

            psx: [
                {

                    partes: [
                        {
                            disco: 1,

                                basePSX + 'psx/disc1.part000',
                                basePSX + 'psx/disc1.part001',
                                basePSX + 'psx/disc1.part002',

                                basePSX + 'psx/disc1.part005'
                            ]
                        },
                        {

                                basePSX + 'psx/disc2.part002',

                                basePSX + 'psx/disc2.part004',
                                basePSX + 'psx/disc2.part005',
                                basePSX + 'psx/disc2.part006',
                                basePSX + 'psx/disc2.part007',

                {

                        {

                                basePSX + 'psx/vfx1.part004',
                                basePSX + 'psx/vfx1.part005',
                                basePSX + 'psx/vfx1.part006',
                                basePSX + 'psx/vfx1.part007',
                                basePSX + 'psx/vfx1.part008',
                                basePSX + 'psx/vfx1.part009',
                                basePSX + 'psx/vfx1.part010',
                                basePSX + 'psx/vfx1.part011',
                                basePSX + 'psx/vfx1.part012',
                                basePSX + 'psx/vfx1.part013'
                            ]
                        }
                    ]
                },

                {
                    nombre: 'Macross VF-X2',
                    core: 'psx',
                    bios: basePSX + 'psx/SCPH1001.BIN',
                    partes: [
                        {
                            disco: 1,

                                basePSX + 'psx/vfx2.part000',
                                basePSX + 'psx/vfx2.part001',
                                basePSX + 'psx/vfx2.part002',

                                basePSX + 'psx/vfx2.part007',
                                basePSX + 'psx/vfx2.part008'
                            ]
                        }
                    ]
                },

                {
                    nombre: 'Macross Plus - Game Edition',
                    core: 'psx',
                    bios: basePSX + 'psx/SCPH1001.BIN',
                    partes: [
                        {
                            disco: 1,
                            archivos: [
                                basePSX + 'psx/plus.part000',
                                basePSX + 'psx/plus.part001',
                                basePSX + 'psx/plus.part002',
                                basePSX + 'psx/plus.part003',
                                basePSX + 'psx/plus.part004',
                                basePSX + 'psx/plus.part005',
                                basePSX + 'psx/plus.part006',
                                basePSX + 'psx/plus.part007',
                                basePSX + 'psx/plus.part008',
                                basePSX + 'psx/plus.part009',
                                basePSX + 'psx/plus.part010',
                                basePSX + 'psx/plus.part011',
                                basePSX + 'psx/plus.part012',
                                basePSX + 'psx/plus.part013',
                                basePSX + 'psx/plus.part014',
                                basePSX + 'psx/plus.part015'
                            ]
                        }
                    ]
                }
            ]
        };

        const params = new URLSearchParams(window.location.search);

        /* ==========================================
           CONTENEDOR RESPONSIVO DEL JUEGO
           ========================================== */
        function crearContenedorJuego() {
            document.getElementById('emulador').innerHTML = `
                <div class="game-container">
                    <div id="game"></div>
                </div>
            `;
        }

        /* ==========================================
           CARGA DIRECTA MEDIANTE PARÁMETROS URL
           ========================================== */
        if (params.get('core') && params.get('rom')) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            crearContenedorJuego();

            document.getElementById('btnVolver').style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = params.get('core');

            const romParam = params.get('rom');

            try {
                const parsed = JSON.parse(romParam);

                window.EJS_gameUrl = Array.isArray(parsed)
                    ? parsed[0]
                    : parsed;

                if (Array.isArray(parsed) && parsed.length > 1) {
                    window.EJS_multidisk = parsed;
                }
            } catch (e) {
                window.EJS_gameUrl = romParam;
            }

            window.EJS_pathtodata = 'data/';

            if (params.get('bios')) {
                window.EJS_biosUrl = params.get('bios');
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

        /* ==========================================
           ACTUALIZAR LISTA DE JUEGOS
           ========================================== */
        function actualizarJuegos() {
            const consola = document.getElementById('consola').value;
            const selectJuego = document.getElementById('juego');

            selectJuego.innerHTML =
                '<option value="">Selecciona juego</option>';

            if (consola && juegos[consola]) {
                juegos[consola].forEach((juego, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = juego.nombre;
                    selectJuego.appendChild(option);
                });
            }
        }

        /* ==========================================
           ENSAMBLAR JUEGOS DE PLAYSTATION
           ========================================== */
        async function ensamblarDiscos(juego) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            document.getElementById('emulador').innerHTML = `
                <div style="
                    width:100%;
                    max-width:700px;
                    margin:0 auto;
                    padding:40px 15px;
                    text-align:center;
                ">
                    <div id="progreso" style="
                        color:#00ffcc;
                        font-size:14px;
                        overflow-wrap:anywhere;
                    ">
                        Preparando descarga...
                    </div>

                    <div style="
                        width:100%;
                        max-width:400px;
                        margin:20px auto;
                        background:#111;
                        border:1px solid #0077b6;
                    ">
                        <div id="barra" style="
                            width:0%;
                            height:20px;
                            background:#00ffcc;
                            transition:width 0.3s;
                        "></div>
                    </div>

                    <div id="detalle" style="
                        color:#00ffcc;
                        font-size:12px;
                    "></div>
                </div>
            `;

            document.getElementById('btnVolver').style.display = 'block';

            const totalPartes = juego.partes.reduce(
                (total, disco) => total + disco.archivos.length,
                0
            );

            let descargadas = 0;
            const urls = [];

            for (let d = 0; d < juego.partes.length; d++) {
                const disco = juego.partes[d];
                const partes = [];

                for (let i = 0; i < disco.archivos.length; i++) {
                    const progreso = document.getElementById('progreso');
                    const barra = document.getElementById('barra');
                    const detalle = document.getElementById('detalle');

                    progreso.textContent =
                        `Descargando Disco ${disco.disco} - parte ${i + 1} de ${disco.archivos.length}...`;

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;

                    try {
                        const resp = await fetch(disco.archivos[i]);

                        if (!resp.ok) {
                            throw new Error(
                                `Error HTTP ${resp.status} al descargar ${disco.archivos[i]}`
                            );
                        }

                        partes.push(await resp.arrayBuffer());
                    } catch (error) {
                        progreso.textContent = 'Error durante la descarga.';
                        detalle.textContent =
                            'No se pudo descargar una parte del juego. Revisá la conexión e intentá nuevamente.';

                        console.error(error);
                        return;
                    }

                    descargadas++;

                    barra.style.width =
                        (descargadas / totalPartes * 100) + '%';

                    detalle.textContent =
                        `Partes descargadas: ${descargadas} de ${totalPartes}`;
                }

                const blob = new Blob(partes, {
                    type: 'application/octet-stream'
                });

                urls.push(URL.createObjectURL(blob));
            }

            document.getElementById('progreso').textContent =
                'Iniciando emulador...';

            document.getElementById('detalle').textContent = '';

            /*
             * Conservamos la lógica original de carga:
             * el primer disco se entrega al emulador.
             */
            crearContenedorJuego();

            window.EJS_player = '#game';
            window.EJS_core = juego.core;
            window.EJS_gameUrl = urls[0];
            window.EJS_pathtodata = 'data/';

            if (juego.bios) {
                window.EJS_biosUrl = juego.bios;
            }

            const script = document.createElement('script');
            script.src = 'data/loader.js';
            document.body.appendChild(script);
        }

        /* ==========================================
           CARGAR JUEGO SELECCIONADO
           ========================================== */
        function cargarJuego() {
            const consola = document.getElementById('consola').value;
            const idx = document.getElementById('juego').value;

            if (!consola || idx === '') {
                return;
            }

            const juego = juegos[consola][idx];

            if (juego.partes) {
                ensamblarDiscos(juego);

            } else if (Array.isArray(juego.archivo)) {
                document.getElementById('header').style.display = 'none';
                document.getElementById('menu').style.display = 'none';

                crearContenedorJuego();

                document.getElementById('btnVolver').style.display = 'block';

                window.EJS_player = '#game';
                window.EJS_core = juego.core;
                window.EJS_gameUrl = juego.archivo;
                window.EJS_pathtodata = 'data/';

                if (juego.bios) {
                    window.EJS_biosUrl = juego.bios;
                }

                const script = document.createElement('script');
                script.src = 'data/loader.js';
                document.body.appendChild(script);

            } else {
                let url =
                    '?core=' + encodeURIComponent(juego.core) +
                    '&rom=' + encodeURIComponent(juego.archivo);

                if (juego.bios) {
                    url += '&bios=' + encodeURIComponent(juego.bios);
                }

                window.location.href = url;
            }
        }

        /* ==========================================
           EVENTOS DE LOS CONTROLES
           ========================================== */
        document.getElementById('consola').addEventListener(
            'change',
            actualizarJuegos
        );

        document.getElementById('btnJugar').addEventListener(
            'click',
            cargarJuego
        );

        document.getElementById('btnVolver').addEventListener(
            'click',
            () => {
                window.location.href = window.location.pathname;
            }
        );
    </script>
</body>
</html>
